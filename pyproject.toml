[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-reconstruction"
version = "0.1.0"
description = "Linear reconstruction of spectral integrals with explicit model systematics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "mpmath>=1.3", "threadpoolctl>=3"]

[project.optional-dependencies]
jks = ["jks-system>=1.1.10"]
test = ["pytest>=7"]
applications = ["jks-system>=1.1.10", "pandas>=2", "matplotlib>=3.7"]
notebooks = [
    "matplotlib>=3.7",
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbformat>=5.9",
    "nbclient>=0.8",
    "nbconvert>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_reference"]
pythonpath = ["src"]
markers = ["slow: high precision or extended numerical validation"]

[tool.black]
target-version = ["py311"]

